name: Repair release docs

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to rebuild (vX.Y.Z)"
        required: true
        type: string
      source_ref:
        description: "Corrective descendant ref (blank uses the release tag)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: docs-build-repair-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: docs-repair
    steps:
      - name: Resolve the site staging directory
        run: echo "SITE_DIR=$RUNNER_TEMP/httk-docs-site" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref || format('refs/tags/{0}', inputs.version) }}
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify checked-out source
        env:
          RELEASE_TAG: ${{ inputs.version }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          if [ -z "$SOURCE_REF" ]; then
            test "$(git describe --exact-match --tags HEAD 2>/dev/null || true)" = "$RELEASE_TAG"
          else
            git merge-base --is-ancestor "$RELEASE_TAG^{}" HEAD
            test "$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" = "${RELEASE_TAG#v}"
          fi
      - name: Install locked environment and verify snapshot
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          pip install -r docs/requirements.lock
          pip install -e submodules/httk-core --no-deps
          pip install -e submodules/httk-atomistic --no-deps
          pip install -e submodules/httk-analyse --no-deps
          pip install -e submodules/httk-store --no-deps
          pip install -e submodules/httk-serve --no-deps
          pip install -e submodules/httk-workflow --no-deps
          pip install -e ".[docs]" --no-deps
          pip check
          PYTHONPATH=submodules/httk-core/src python -m httk.core.docs ecosystem-manifest --submodules-dir submodules --verify docs/ecosystem.json --require-release-tags
      - name: Verify aggregate source topology
        run: |
          python scripts/verify_topology.py
          python scripts/check_lock_members.py
      - name: Check release version
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          PYTHONPATH=submodules/httk-core/src python -m httk.core.docs check-release --tag "$RELEASE_TAG"
      - name: Execute first-use examples
        run: make first-use-check
      - name: Build repaired release docs
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: HTTK_DOCS_VERSION="$RELEASE_TAG" HTTK_DOCS_BASE_URL=https://docs.httk.org make docs-full
      - name: Compose and publish repaired docs-site
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          SOURCE_COMMIT=$(git rev-parse HEAD)
          export SOURCE_COMMIT
          git fetch origin docs-site || true
          for attempt in 1 2 3 4 5 6 7 8; do
            lease_sha=$(git rev-parse origin/docs-site 2>/dev/null || echo "")
            rm -rf "$SITE_DIR"; mkdir -p "$SITE_DIR"
            if git show-ref --verify --quiet refs/remotes/origin/docs-site; then git archive origin/docs-site | tar -x -C "$SITE_DIR"; fi
            PYTHONPATH=submodules/httk-core/src python -m httk.core.docs compose --site "$SITE_DIR" --build docs/_build/html --repair "$RELEASE_TAG" --slug "" --url https://docs.httk.org --source-commit "$SOURCE_COMMIT"
            PYTHONPATH=submodules/httk-core/src python -m httk.core.docs commit-site --site "$SITE_DIR" --repo "$GITHUB_WORKSPACE" --branch docs-site --message "repair: $RELEASE_TAG"
            if git push --force-with-lease=refs/heads/docs-site:$lease_sha origin docs-site; then break; fi
            if [ "$attempt" -eq 8 ]; then echo "docs-site repair push was rejected after 8 attempts" >&2; exit 1; fi
            sleep $((RANDOM % 5 + attempt * 3)); git fetch origin docs-site
          done
