[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "httk.github.io"
version = "2.0.0"
description = "httk2 docs website"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Rickard Armiento", email = "rickard-gpg@armiento.net" }]

dependencies = []

[tool.setuptools]
py-modules = []
packages = []

[project.optional-dependencies]
docs = [
  "sphinx",
  "furo",
  "myst-parser",
  "myst-nb",
  "sphinx-copybutton",
  "sphinx-autoapi",
  "sphinx-autodoc-typehints",
  # httk-data runtime
  "jsonschema>=4",
  # httk-serve runtime
  "starlette>=0.37",
  # httk-serve runtime
  "uvicorn>=0.30",
  # httk-serve runtime
  "jinja2>=3.1",
  # httk-serve runtime
  "markdown>=3.5",
  # httk-serve runtime
  "PyYAML>=6.0",
  # httk-serve runtime
  "docutils>=0.20",
  # httk-serve runtime
  "python-multipart>=0.0.9",
  # httk-core[default] and httk-atomistic[default] / docs import
  "numpy>=1.26",
  # httk-core[default]
  "cryptography>=42",
  # httk-atomistic[default]
  "spglib>=2.0",
  # httk-io[default]
  "ase",
  # httk-data[default] -> [db]
  "sqlalchemy>=2.0,<3",
  # httk-serve[docs]
  "httpx>=0.27",
]

# The httk distributions themselves are not listed here: CI installs all six
# editable with --no-deps, so this extra carries their external runtime and
# docs-relevant default dependencies as well as the Sphinx tooling.
